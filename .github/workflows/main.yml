name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Bore"
          netsh advfirewall firewall add rule name="RDP-Bore" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = [char[]]'!@#$%^&*'
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 5
          $rawPassword += $charSet.Lower | Get-Random -Count 5
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 3
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          Remove-LocalUser -Name "KAVI" -ErrorAction SilentlyContinue
          New-LocalUser -Name "KAVI" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "KAVI"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "KAVI"
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install bore
        run: |
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath bore -Force

      - name: Start bore Tunnel
        run: |
          Start-Process -FilePath ".\bore\bore.exe" -ArgumentList "local 3389 --to bore.pub" `
            -RedirectStandardOutput bore.log -RedirectStandardError bore.err -WindowStyle Hidden

          $addr = $null
          $retries = 0
          while (-not $addr -and $retries -lt 12) {
              Start-Sleep -Seconds 5
              $text = (Get-Content bore.log, bore.err -ErrorAction SilentlyContinue) -join " "
              if ($text -match "bore\.pub:(\d+)") { $addr = "bore.pub:" + $Matches[1] }
              $retries++
          }

          if (-not $addr) {
              Get-Content bore.log, bore.err -ErrorAction SilentlyContinue
              Write-Error "bore tunnel not created"
              exit 1
          }
          echo "BORE_ADDR=$addr" >> $env:GITHUB_ENV

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address : $env:BORE_ADDR"
          Write-Host "Username: KAVI"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "==================`n"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel the workflow to stop"
              Start-Sleep -Seconds 300
          }
