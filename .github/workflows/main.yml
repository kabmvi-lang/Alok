name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download ngrok
      run: Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip

    - name: Extract
      run: Expand-Archive ngrok.zip -DestinationPath ngrok -Force

    - name: Auth
      run: .\ngrok\ngrok.exe config add-authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Create user with random password
      run: |
        $chars = [char[]]((65..90) + (97..122) + (48..57))
        $password = -join (($chars | Get-Random -Count 16)) + "@1a"
        $secure = ConvertTo-SecureString $password -AsPlainText -Force
        Remove-LocalUser -Name "KAVI" -ErrorAction SilentlyContinue
        New-LocalUser -Name "KAVI" -Password $secure -AccountNeverExpires
        Add-LocalGroupMember -Group "Administrators" -Member "KAVI"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "KAVI"
        Write-Host "=== RDP LOGIN ==="
        Write-Host "User: KAVI | Password: $password"
        Write-Host "================="

    - name: Create Tunnel
      run: .\ngrok\ngrok.exe tcp 3389 --log=stdout
